server:
  port: 8084

spring:
  application:
    name: operations-service
  datasource:
    
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/operations_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

