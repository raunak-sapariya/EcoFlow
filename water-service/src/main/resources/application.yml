server:
  port: 8082

spring:
  application:
    name: water-service
  datasource:
    # Defaults match docker-compose.yml. Override with env vars (see .env.example).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/water_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update   # tables are created/updated from the @Entity classes. Fine for a hackathon.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
