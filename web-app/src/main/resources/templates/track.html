<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Track a ticket')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main>
	<h1>Track your ticket</h1>
	<p class="note">Enter the ticket number you received and the mobile number you used.</p>
	<div th:replace="~{fragments/layout :: flash}"></div>

	<h2>Find a ticket</h2>
	<form class="entry" th:action="@{/track}" method="get">
		<label>Ticket number <input name="id" type="number" min="1" th:value="${id}" required></label>
		<label>Mobile number <input name="phone" pattern="[0-9]{10}" th:value="${phone}" required></label>
		<div class="wide"><button type="submit">Check status</button></div>
	</form>

	<h2>Ticket status</h2>
	<div class="table-box" th:if="${ticket != null}">
		<table>
			<tr>
				<th>Ticket</th>
				<th>Category</th>
				<th>Area</th>
				<th>Description</th>
				<th>Status</th>
				<th>Filed on</th>
				<th>Resolved on</th>
				<th>What we did</th>
			</tr>
			<tr>
				<td th:text="'#' + ${ticket.id}">#1</td>
				<td th:text="${ticket.category != null ? ticket.category : '-'}">LEAKAGE</td>
				<td th:text="${zoneName != null ? zoneName : '-'}">Madurai Central</td>
				<td th:text="${ticket.description != null ? ticket.description : '-'}">Leak</td>
				<td th:text="${ticket.status != null ? ticket.status : '-'}">OPEN</td>
				<td th:text="${ticket.createdAt != null ? #temporals.format(ticket.createdAt, 'dd-MM-yyyy HH:mm') : '-'}">07-10-2026</td>
				<td th:text="${ticket.resolvedAt != null ? #temporals.format(ticket.resolvedAt, 'dd-MM-yyyy HH:mm') : '-'}">-</td>
				<td th:text="${ticket.resolutionNote != null ? ticket.resolutionNote : '-'}">-</td>
			</tr>
		</table>
	</div>
	<p th:if="${ticket == null}">Enter a ticket number and mobile number above.</p>
</main>
</body>
</html>
