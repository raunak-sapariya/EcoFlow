server:
  port: 8083

spring:
  application:
    name: supply-service
  datasource:
    # Defaults match docker-compose.yml. Override with env vars (see .env.example).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/supply_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update   # tables are created/updated from the @Entity classes. Fine for a hackathon.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  services:
    # supply-service asks water-service how full a zone's source is before planning supply.
    water-service: ${WATER_SERVICE_URL:http://localhost:8082}
